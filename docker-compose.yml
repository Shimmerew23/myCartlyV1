version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL (Prisma)
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: CartLy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartly
      POSTGRES_PASSWORD: cartlypass
      POSTGRES_DB: cartly_ecommerce
    ports:
      # Host 5433 -> container 5432 to avoid clashing with a native Postgres on 5432.
      # In-compose services still reach it at postgres:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - CartLy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartly -d cartly_ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: CartLy_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass CartLyredis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - CartLy_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────
  # Backend (Node.js / Express)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: CartLy_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cartly:cartlypass@postgres:5432/cartly_ecommerce?schema=public
      REDIS_URL: redis://:CartLyredis@redis:6379
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - CartLy_net

  # ─────────────────────────────────────────
  # Frontend (React / Vite)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: CartLy_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - CartLy_net

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: CartLy_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - CartLy_net

volumes:
  postgres_data:
  redis_data:

networks:
  CartLy_net:
    driver: bridge
